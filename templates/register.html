<!DOCTYPE html>
<html>
<head><title>Register</title></head>
<body>
  <h2>Register</h2>
  {% with messages = get_flashed_messages() %}
    {% if messages %}<p style="color:red">{{ messages[0] }}</p>{% endif %}
  {% endwith %}
  <form method="POST">
    <label>I am a:
      <select name="user_type" id="user_type" onchange="toggleFields()">
        <option value="individual">Individual</option>
        <option value="company">Company</option>
      </select>
    </label><br><br>

    <div id="individual_fields">
      <input type="text" name="fullName" placeholder="Full Name"><br>
    </div>
    <div id="company_fields" style="display:none">
      <input type="text" name="companyName" placeholder="Company Name"><br>
    </div>

    <input type="email" name="email" placeholder="Email" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <button type="submit">Register</button>
  </form>
  <p><a href="{{ url_for('auth.login') }}">Already have an account? Login</a></p>

  <script>
    function toggleFields() {
      const type = document.getElementById("user_type").value;
      document.getElementById("individual_fields").style.display = type === "individual" ? "block" : "none";
      document.getElementById("company_fields").style.display = type === "company" ? "block" : "none";
    }
  </script>
</body>
</html>
